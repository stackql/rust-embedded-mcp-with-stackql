# Act 3 workspace: two agents on the same crate, one per way of embedding the
# StackQL MCP server. sre-agent-sidecar acquires the server as a sidecar and talks to
# Claude; finops-agent-vendored vendors the server straight into the binary and talks
# to GPT-5. Model, prompts (compiled-in markdown), context and MCP tools in
# each; the loop is rig's.
#
# The other members are companion examples outside the talk flow, kept because
# each shows something the two agents do not: minimal and minimal-vendored (the
# smallest embedding, no model), steward (policy-driven agent with the
# human-in-the-loop write path over MCP elicitation), auditron (YAML control
# packs, live TUI, evidence zips, no agent loop) and stackql-agent (REPL with
# three personas over public GitHub data, zero credentials). steward and
# stackql-agent pin rig-core 0.38 in their own manifests, the release they were
# written against; cargo builds both rig versions side by side.
[workspace]
resolver = "2"
members = [
    "sre-agent-sidecar",
    "finops-agent-vendored",
    "minimal",
    "minimal-vendored",
    "steward",
    "auditron",
    "stackql-agent",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# Version-locked to the stackql release it embeds; pin the minor.
stackql-mcp = "0.10"
# rig-core 0.40 is the last release with the rmcp feature (0.41 dropped it);
# it and stackql-mcp resolve on the same rmcp 1.x, so the connected client the
# crate hands back plugs straight into rig's agent builder.
rig = { package = "rig-core", version = "0.40", features = ["rmcp"] }
rmcp = { version = "1.8", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
